---
# How the S3 routes attach to the platform gateway. Both the SeaweedFS S3 route
# and the ONTAP S3 route claim the same hostname, so both use what this resolves.
#
# When the platform gateway has a listener claiming s3.<base_domain> exactly (the
# platform's 'https-s3' (gateway_s3_listener_name), which holds the
# ClientTrafficPolicy SigV4 needs), the route binds it; otherwise the S3 host is
# published with a listener of its own (gateway_publish). Core creates that
# listener from ontap_s3_data_lif alone, which is not the condition this role
# activates the proxy on, so it is resolved from the live Gateway.

- name: "app_edp | S3 listener | Read the platform gateway listeners"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    # Foreign: owned by the gateway role.
    name: "{{ gateway_name | default('eg-gateway') }}"
    namespace: "{{ gateway_namespace | default('envoy-gateway-system') }}"
  register: _edp_s3_gw_listeners
  check_mode: false
  changed_when: false

# How the S3 routes publish (gateway_publish_attach), read-only:
#   s3    the platform's dedicated S3 listener claims the host (signed paths intact)
#   apex  routing_mode path: the S3 API is a path on the apex host
#   host  otherwise: a listener of its own for the S3 host
# _edp_s3_section is that listener's sectionName when known here ('' = the
# publication's own listener, reported by gateway_publish_result).
- name: "app_edp | S3 listener | Select the listener that claims the S3 hostname"
  ansible.builtin.set_fact:
    _edp_s3_attach: "{{ 'apex' if _edp_s3_path_mode | bool else 's3' if _exact else 'host' }}"
    _edp_s3_section: "{{ 'https-apex' if _edp_s3_path_mode | bool else _exact }}"
  vars:
    _tls_listeners: >-
      {{ (_edp_s3_gw_listeners.resources | default([{}]) | first).spec.listeners | default([])
         | selectattr('protocol', 'eq', 'HTTPS') | list }}
    _exact: >-
      {{ '' if _edp_s3_path_mode | bool else
         _tls_listeners | selectattr('name', 'eq', _s3_listener)
         | selectattr('hostname', 'defined') | selectattr('hostname', 'eq', _edp_s3_host)
         | map(attribute='name') | list | first | default('', true) }}
    # Foreign: owned by the gateway role. Only the platform's S3 listener counts:
    # a publication's own listener for the same host (listener mode) is not it.
    _s3_listener: "{{ gateway_s3_listener_name | default('https-s3') }}"
