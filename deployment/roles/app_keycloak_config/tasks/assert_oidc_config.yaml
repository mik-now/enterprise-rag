---
- name: "app_keycloak_config | Assert external OIDC configuration is complete"
  vars:
    _chattool_oidc_empty_vars: >-
      {{ {'chattool_keycloak_oidc_endpoint': chattool_keycloak_oidc_endpoint | default('', true) | string | trim,
          'chattool_keycloak_oidc_alias': chattool_keycloak_oidc_alias | default('', true) | string | trim,
          'chattool_keycloak_oidc_client_id': chattool_keycloak_oidc_client_id | default('', true) | string | trim,
          'chattool_keycloak_oidc_client_secret': chattool_keycloak_oidc_client_secret | default('', true) | string | trim}
         | dict2items | selectattr('value', 'falsy') | map(attribute='key') | list }}
  block:
    - name: "app_keycloak_config | Assert Single Sign-On configuration is complete"
      ansible.builtin.assert:
        that: _chattool_oidc_empty_vars | length == 0
        fail_msg: >-
          Incomplete Single Sign-On configuration: chattool_keycloak_oidc_endpoint is set but
          {{ _chattool_oidc_empty_vars | join(', ') }}
          {{ 'is' if _chattool_oidc_empty_vars | length == 1 else 'are' }} empty.
          Set them in env/<name>/config.erag.yaml, or clear chattool_keycloak_oidc_endpoint
          to disable Single Sign-On.
        success_msg: "app_keycloak_config: Single Sign-On configuration complete"
        quiet: true
      when: chattool_keycloak_oidc_endpoint | default('', true) | string | trim | length > 0

    - name: "app_keycloak_config | Assert SharePoint configuration is complete"
      ansible.builtin.assert:
        that: _sp_missing | length == 0
        fail_msg: >-
          Incomplete SharePoint configuration: chattool_keycloak_oidc_tenant_id is set but
          {{ _sp_missing | join(', ') }} {{ 'is' if _sp_missing | length == 1 else 'are' }} empty.
          SharePoint ingestion requires chattool_keycloak_oidc_tenant_id,
          chattool_keycloak_oidc_client_id, chattool_keycloak_oidc_client_secret and
          chattool_keycloak_oidc_endpoint together.
          Set them in env/<name>/config.erag.yaml, or clear chattool_keycloak_oidc_tenant_id
          to disable SharePoint.
        success_msg: "app_keycloak_config: SharePoint configuration complete"
        quiet: true
      vars:
        _sp_missing: >-
          {{ _chattool_oidc_empty_vars | intersect(['chattool_keycloak_oidc_endpoint',
                                                   'chattool_keycloak_oidc_client_id',
                                                   'chattool_keycloak_oidc_client_secret']) }}
      when: chattool_keycloak_oidc_tenant_id | default('', true) | string | trim | length > 0
